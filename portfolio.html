<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suman Photography | Portfolio</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 7%;
  border-bottom: 1px solid #222;
  text-align: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 3px;
}

.logo span {
  color: #d4af37;
}

.hero {
  padding: 80px 7% 50px;
  text-align: center;
}

.hero h1 {
  font-size: 52px;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #d4af37;
}

.hero p {
  color: #aaa;
  font-size: 18px;
}

.gallery {
  width: 90%;
  max-width: 1200px;
  margin: 40px auto 100px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.gallery img {
  width: 100%;
  height: 380px;
  object-fit: cover;
  transition: 0.4s;
}

.gallery img:hover {
  transform: scale(1.03);
  opacity: 0.8;
}

.cta {
  text-align: center;
  padding: 70px 20px;
  background: #111;
}

.cta h2 {
  font-size: 36px;
  margin-bottom: 15px;
}

.cta span {
  color: #d4af37;
}

.cta p {
  color: #aaa;
  margin-bottom: 30px;
}

.btn {
  display: inline-block;
  padding: 15px 35px;
  background: #d4af37;
  color: #000;
  text-decoration: none;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}

@media(max-width: 700px) {
  .hero h1 {
    font-size: 38px;
  }

  .gallery {
    grid-template-columns: 1fr;
  }

  .gallery img {
    height: 400px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SUMAN <span>PHOTOGRAPHY</span></div>
</header>

<section class="hero">
  <h1>MY <span>PORTFOLIO</span></h1>
  <p>A collection of beautiful moments captured with emotion and creativity.</p>
</section>

<section class="gallery">

  <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=80">

  <img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=900&q=80">

  <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=900&q=80">

  <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=900&q=80">

  <img src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=900&q=80">

  <img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=900&q=80">

</section>

<section class="cta">
  <h2>Let's Create <span>Memories</span></h2>
  <p>Your special moments deserve to be remembered beautifully.</p>
  <a class="btn" href="index.html">BACK TO HOME</a>
</section>

<footer>
  © 2026 Suman Photography. All Rights Reserved.
</footer>

</body>
</html>
