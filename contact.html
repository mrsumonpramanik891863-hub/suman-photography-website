        <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Suman Photography</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <nav class="nav">

      <a href="index.html" class="logo">
        SUMAN <span>PHOTOGRAPHY</span>
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a class="active" href="contact.html">Contact</a>
      </div>

    </nav>
  </header>


  <!-- PAGE TITLE -->
  <section class="page-title">

    <p class="small-title">
      LET'S TALK
    </p>

    <h1>
      GET IN <span>TOUCH</span>
    </h1>

    <p>
      Your story starts with a conversation.
    </p>

  </section>


  <!-- CONTACT SECTION -->
  <main>

    <section class="contact-section">

      <div class="contact-info">

        <p class="small-title">
          BOOK YOUR DATE
        </p>

        <!-- BOOKING FORM -->
        <form
          action="https://formspree.io/f/xeajglaz"
          method="POST"
        >

          <!-- NAME -->
          <input
            type="text"
            name="Name"
            placeholder="Your Name"
            required
          >


          <!-- WEDDING TYPE -->
          <select
            name="Wedding Type"
            required
          >
            <option value="" disabled selected>
              Select Wedding Type
            </option>

            <option value="Wedding">
              Wedding
            </option>

            <option value="Pre-Wedding">
              Pre-Wedding
            </option>

            <option value="Reception">
              Reception
            </option>

            <option value="Other">
              Other
            </option>
          </select>


          <!-- CONTACT NUMBER -->
          <input
            type="tel"
            name="Contact Number"
            placeholder="Contact Number"
            maxlength="10"
            inputmode="numeric"
            required
          >


          <!-- EVENT DATE -->
          <input
            type="date"
            name="Event Date"
            required
          >


          <!-- LOCATION -->
          <input
            type="text"
            name="Location"
            placeholder="Event Location"
            required
          >


          <!-- SUBMIT -->
          <button type="submit">
            BOOK YOUR DATE
          </button>

        </form>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <div class="footer-links">

      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>

    </div>

    <p class="copyright">
      © 2026 Suman Photography.
      All Rights Reserved.
    </p>

  </footer>


  <!-- MAIN JAVASCRIPT -->
  <script src="script.js"></script>

</body>

</html>
